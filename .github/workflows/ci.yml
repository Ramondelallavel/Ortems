name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monxu_test
          POSTGRES_USER: monxu
          POSTGRES_PASSWORD: monxu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monxu -d monxu_test" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - run: ruff check .
      - name: Engine + platform tests (SQLite)
        run: pytest -q
      - name: Migrations and platform tests (PostgreSQL)
        env:
          MONXU_DATABASE_URL: postgresql+psycopg://monxu:monxu@localhost:5432/monxu_test
          MONXU_TEST_DATABASE_URL: postgresql+psycopg://monxu:monxu@localhost:5432/monxu_test
        run: |
          alembic -c monxuplan/alembic.ini upgrade head
          alembic -c monxuplan/alembic.ini check
          pytest -q tests/platform

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
