name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"  # nightly: long fuzzing and dependency audit against new advisories

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monxu_test
          POSTGRES_USER: monxu
          POSTGRES_PASSWORD: monxu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monxu -d monxu_test" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the versions the code was tested with (constraints.txt); ranges in pyproject stay open for library use
      - run: pip install -c constraints.txt -e ".[dev,postgres]"
      - run: ruff check .
      - name: Engine + platform tests (SQLite), with coverage
        env:
          MONXU_FUZZ_SEEDS: ${{ github.event_name == 'schedule' && '3000' || '150' }}
        run: pytest -q --cov=monxuplan --cov=monxuplan_engine --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Migrations and platform tests (PostgreSQL)
        env:
          MONXU_DATABASE_URL: postgresql+psycopg://monxu:monxu@localhost:5432/monxu_test
          MONXU_TEST_DATABASE_URL: postgresql+psycopg://monxu:monxu@localhost:5432/monxu_test
        run: |
          alembic -c monxuplan/alembic.ini upgrade head
          alembic -c monxuplan/alembic.ini check
          pytest -q tests/platform
      - name: Migration downgrade / upgrade round trip (PostgreSQL)
        env:
          MONXU_DATABASE_URL: postgresql+psycopg://monxu:monxu@localhost:5432/monxu_test
        run: |
          alembic -c monxuplan/alembic.ini downgrade 0003
          alembic -c monxuplan/alembic.ini upgrade head
      - name: Dependency audit (known vulnerabilities) and SBOM
        run: |
          pip install pip-audit
          pip-audit -r <(grep -v '^#' constraints.txt) --strict
          pip-audit -r <(grep -v '^#' constraints.txt) --format cyclonedx-json --output sbom-backend.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/coverage.xml
            backend/sbom-backend.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency audit (production dependencies) and SBOM
        run: |
          npm audit --omit=dev --audit-level=high
          npm sbom --sbom-format cyclonedx --omit dev > sbom-frontend.json
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: frontend/sbom-frontend.json
