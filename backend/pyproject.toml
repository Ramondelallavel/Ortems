[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monxuplan"
version = "1.0.0"
description = "MonxuPlan — Advanced Planning & Scheduling platform (API, platform services and planning engine)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "ortools>=9.10",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "pyjwt[crypto]>=2.8",
  "prometheus-client>=0.20",
  "cryptography>=42",
  "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
redis = ["redis>=5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["monxuplan*", "monxuplan_engine*"]

[tool.setuptools.package-data]
monxuplan = ["seed/*.json", "alembic.ini", "migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: long-running optimisation tests",
  "postgres: requires PostgreSQL (MONXU_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 170
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "E731", "SIM108", "SIM102", "B905"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
